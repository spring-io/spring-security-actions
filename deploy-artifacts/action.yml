name: Deploy Artifacts
description: Deploy Spring Security Artifacts

inputs:
  version:
    description: "The artifact version to deploy"
    required: true
  username:
    description: "The artifact repository username"
    required: true
  password:
    description: "The artifact repository password"
    required: true
  repository-uri:
    description: "The artifact repository URI (e.g. from compute-artifact-repository)"
    required: true
  repository-name:
    description: "The artifact repository name (e.g. from compute-artifact-repository)"
    required: true
  local-repository:
    description: "The location of the local repository to deploy"
    required: false
    default: "build/publications/repos"

runs:
  using: "composite"
  steps:
    - id: branch-name
      name: Extract Branch Name
      shell: bash
      env:
        BRANCH: ${{ github.ref_name }}
        VERSION: ${{ inputs.version }}
      run: |
        branch=$BRANCH
        if [[ "$branch" = "main" ]] ; then
          branch="${VERSION%.*}.x"
        fi
        echo "branch=$branch" >> $GITHUB_OUTPUT
    - name: Remove Checksums
      if: ${{ inputs.repository-name == 'maven2' }}
      shell: bash
      run: |
        # rm checksums to work around https://github.com/spring-io/central-publish-action/issues/11
        find -name "*.md5" | xargs rm -f
        find -name "*.sha*" | xargs rm -f
    - name: Publish Staged Artifacts to Central
      if: ${{ inputs.repository-name == 'maven2' }}
      uses: spring-io/central-publish-action@5ea05c77127404d89c374ac4cd17b6ec6b0e7293  # v0.4.0
      with:
        token-name: ${{ inputs.username }}
        token: ${{ inputs.password }}
        dir: ${{ inputs.local-repository }}
    - name: Deploy to Artifactory
      if: ${{ inputs.repository-name != 'maven2' }}
      uses: spring-io/artifactory-deploy-action@926d7f7cc810569395346bf3a4d91b380b3e355b  # v0.0.4
      with:
        uri: ${{ inputs.repository-uri }}
        repository: ${{ inputs.repository-name }}
        build-name: ${{ github.event.repository.name }}-${{ steps.branch-name.outputs.branch }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        folder: ${{ inputs.local-repository }}
