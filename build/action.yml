name: "build"
description: "Build the project and publish it to a local Maven repository"
author: "jzheaux"

inputs:
  java-version:
    description: "The Java version to use"
    required: false
    default: "17"

runs:
  using: "composite"
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: spring-io/spring-gradle-build-action@99a2aa4bd02e3a216fdbc574e256ec860f791d4c  # v2.0.7
      with:
        java-version: ${{ inputs.java-version }}
        distribution: "temurin"
        # Write the Gradle cache on the default branch and on the embargoed LTS branches
        # The LTS branches write so that Dependabot pull requests, which cannot authenticate to the
        # Artifactory virtual repositories, can resolve everything unchanged from the cache.
        cache-read-only: ${{ !startsWith(github.ref_name, 'embargoed/lts/') && github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
    - name: Build with Gradle
      uses: $/run-gradle
      with:
        gradle-args: build publishAllPublicationsToLocalRepository --continue
