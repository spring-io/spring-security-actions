name: "pr-build"
description: "Build a pull request"
author: "jzheaux"

inputs:
  java-version:
    description: "The Java version to use"
    required: false
    default: "17"

runs:
  using: "composite"
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: spring-io/spring-gradle-build-action@99a2aa4bd02e3a216fdbc574e256ec860f791d4c  # v2.0.7
      with:
        java-version: ${{ inputs.java-version }}
        distribution: "temurin"
    - name: Build with Gradle
      uses: $/run-gradle
      with:
        gradle-args: clean build -PskipCheckExpectedBranchVersion=true --continue
