name: Ensure Artifacts
description: Idempotently deploys Spring Security artifacts, skipping deployment if the artifact is already present

inputs:
  version:
    description: "The artifact version to deploy"
    required: true
  username:
    description: "The artifact repository username"
    required: true
  password:
    description: "The artifact repository password"
    required: true
  repository-uri:
    description: "The artifact repository URI (e.g. from compute-artifact-repository)"
    required: true
  repository-name:
    description: "The artifact repository name (e.g. from compute-artifact-repository)"
    required: true
  artifact-path:
    description: "The artifact path in the repository (e.g. org/springframework/security/spring-security-core), used to tell whether this version was already deployed. Defaults to the first artifact found for the version in the local repository"
    required: false
    default: ""
  local-repository:
    description: "The location of the local repository to deploy"
    required: false
    default: "build/publications/repos"
  project:
    description: "The project key for the artifact repository, or empty when no project applies"
    required: false
    default: ""
  ref:
    description: "Ref of spring-security-actions to checkout (defaults to the ref used to invoke this action, e.g. v1)"
    required: false
    default: ${{ github.action_ref }}

runs:
  using: "composite"
  steps:
    - name: Checkout spring-security-actions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: spring-io/spring-security-actions
        ref: ${{ inputs.ref }}
        path: spring-security-actions
    - id: artifact-path
      name: Compute Artifact Path
      if: ${{ !endsWith(inputs.version, '-SNAPSHOT') }}
      shell: bash
      env:
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
        VERSION: ${{ inputs.version }}
        LOCAL_REPOSITORY: ${{ inputs.local-repository }}
      run: |
        if [ -z "$ARTIFACT_PATH" ]; then
          pom=$(find "$LOCAL_REPOSITORY" -type f -name '*.pom' -path "*/$VERSION/*" | LC_ALL=C sort | head -n 1)
          if [ -z "$pom" ]; then
            echo "::error::No artifact for version $VERSION found in $LOCAL_REPOSITORY to compute the artifact path from"
            exit 1
          fi
          ARTIFACT_PATH=$(dirname "$(dirname "${pom#"${LOCAL_REPOSITORY%/}"/}")")
        fi
        echo "Using artifact path $ARTIFACT_PATH"
        echo "value=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"
    - id: check-artifact
      name: Check if Artifact Already Deployed
      if: ${{ !endsWith(inputs.version, '-SNAPSHOT') }}
      continue-on-error: true
      uses: spring-io/spring-release-actions/check-maven-artifact@967a8de4659c4273a82bcb098d73c2330c015254  # 0.0.9
      with:
        repository-url: ${{ inputs.repository-uri }}/${{ inputs.repository-name }}
        artifact-path: ${{ steps.artifact-path.outputs.value }}
        version: ${{ inputs.version }}
        repository-username: ${{ inputs.username }}
        repository-password: ${{ inputs.password }}
    - name: Deploy Artifacts
      if: ${{ steps.check-artifact.outputs.found != 'true' }}
      uses: ./spring-security-actions/deploy-artifacts
      with:
        version: ${{ inputs.version }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        repository-uri: ${{ inputs.repository-uri }}
        repository-name: ${{ inputs.repository-name }}
        local-repository: ${{ inputs.local-repository }}
        project: ${{ inputs.project }}
