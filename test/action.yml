name: "test"
description: "Test the project against snapshot versions of upstream dependencies"
author: "jzheaux"

inputs:
  java-version:
    description: "The Java version to use"
    required: false
    default: "17"
  gradle-args:
    description: "Gradle arguments identifying which snapshot dependencies to test against, e.g. -PspringFrameworkVersion=7.+"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: spring-io/spring-gradle-build-action@99a2aa4bd02e3a216fdbc574e256ec860f791d4c  # v2.0.7
      with:
        java-version: ${{ inputs.java-version }}
        distribution: "temurin"
    - name: Test with Gradle
      uses: $/run-gradle
      with:
        gradle-args: test --refresh-dependencies -PforceMavenRepositories=snapshot ${{ inputs.gradle-args }} --stacktrace
