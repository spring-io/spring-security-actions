name: "deploy-schema"
description: "Deploy the project's XML schema files to the docs host"
author: "jzheaux"

inputs:
  java-version:
    description: "The Java version to use"
    required: false
    default: "17"

runs:
  using: "composite"
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: spring-io/spring-gradle-build-action@99a2aa4bd02e3a216fdbc574e256ec860f791d4c  # v2.0.7
      with:
        java-version: ${{ inputs.java-version }}
        distribution: "temurin"
    - name: Deploy Schema with Gradle
      uses: $/run-gradle
      with:
        gradle-args: deploySchema --stacktrace --info
