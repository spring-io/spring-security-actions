name: "compute-tag-versions"
description: "Works out the release version and the snapshot version of a tag"

inputs:
  tag:
    description: "The tag, for example v7.0.1, 7.1.0-RC1 or v7.1.0-M2"
    required: true

  snapshot-suffix:
    description: "The suffix of the snapshot version, for example -INTERNAL-SNAPSHOT for the snapshot that is only for a release train"
    required: false
    default: "-SNAPSHOT"

outputs:
  release-version:
    description: "The tag without its leading v, for example 7.0.1 or 7.1.0-RC1"
  snapshot-version:
    description: "The release version without its -M<n> or -RC<n>, and with the snapshot suffix, for example 7.0.1-SNAPSHOT or 7.1.0-INTERNAL-SNAPSHOT"

runs:
  using: "node24"
  main: "dist/index.js"
