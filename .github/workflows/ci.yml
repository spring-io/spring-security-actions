name: CI

# Every action with a package.json (the JavaScript ones) is checked on its own: formatted,
# built (dist/ is what GitHub runs, so it must be the build of src/), and tested.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: Find the JavaScript actions
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.find.outputs.names }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check that the release and the code freeze workflows have no script, only actions
        run: "! grep -nE '^[[:space:]]+run:' .github/workflows/release-branches.yml .github/workflows/code-freeze.yml"
      - name: Check that the release and the code freeze workflows use the actions of this repository at a commit
        run: |
          for workflow in release-branches.yml code-freeze.yml; do
            if grep -E 'uses: .*spring-security-actions/' ".github/workflows/$workflow" | grep -vE 'uses: spring-io/spring-security-actions/[a-z-]+@[0-9a-f]{40} # '; then
              echo "::error::$workflow must use the actions of spring-io/spring-security-actions at a commit, with a comment that names the tag"
              exit 1
            fi
          done
      - name: Find the actions that have a package.json
        id: find
        run: |
          names=$(for file in */package.json; do dirname "$file"; done | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          echo "names=$names" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.action }}
    needs: actions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action: ${{ fromJson(needs.actions.outputs.names) }}
    defaults:
      run:
        working-directory: ${{ matrix.action }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.action }}/package-lock.json
      - name: Check that action.yml has no expression, which GitHub evaluates even in a description
        run: "! grep -nE '[$][{][{]' action.yml"
      - name: Install the dependencies
        run: npm ci
      - name: Check the format
        run: npm run check
      - name: Build
        run: npm run compile
      - name: Check that dist is the build of src
        run: git diff --exit-code -- dist
      - name: Test
        run: npm test

  # A workflow that is not valid is not started: GitHub only says that the file has an issue, and a
  # reusable workflow that nothing runs on its own is not noticed until something calls it. So every
  # workflow is linted (syntax, expressions, contexts, the scripts of the steps), and every action.yml
  # is read as YAML and has what GitHub needs to run it.
  lint:
    name: Lint the workflows and the actions
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
      # actionlint 1.7.12, the latest release, does not know the key queue of concurrency (it asks
      # for cancel-in-progress or group only), which GitHub documents and post-publish.yml uses. Only
      # that message is ignored. Remove the -ignore once an actionlint release has the key (its
      # issues 654 and 657).
      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color -ignore ''unexpected key "queue" for "concurrency" section'''
      - name: Check every action.yml
        run: |
          status=0
          for file in */action.yml; do
            if ! yq --exit-status '.name and .description and .runs.using' "$file" > /dev/null; then
              echo "::error file=$file::$file is not valid YAML, or has no name, description or runs.using"
              status=1
              continue
            fi
            main=$(yq '.runs.main // ""' "$file")
            if [ -n "$main" ] && [ ! -f "$(dirname "$file")/$main" ]; then
              echo "::error file=$file::runs.main of $file is $main, which does not exist"
              status=1
            fi
          done
          exit "$status"

  # The one job that a ruleset requires: the jobs of the matrix are named after the actions, which
  # come and go, so they cannot be required by name. A job that was skipped or failed fails this one.
  result:
    name: CI result
    if: always()
    needs: [actions, check, lint]
    runs-on: ubuntu-latest
    env:
      ACTIONS: ${{ needs.actions.result }}
      CHECK: ${{ needs.check.result }}
      LINT: ${{ needs.lint.result }}
    steps:
      - name: Check that every job passed
        run: test "$ACTIONS" = success && test "$CHECK" = success && test "$LINT" = success
