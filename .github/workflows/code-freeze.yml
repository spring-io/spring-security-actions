name: code-freeze

# The code freeze of a project: every branch moves on to its next development version, the
# history is merged forward, and the branches are pushed, while the release branches
# (release/<version>, built by the release-branches workflow) do the releasing.
#
#   1. Plan (read-only). The branches come from the Spring projects API (the OSS generations and the
#      commercial, long-term support ones), or from the inputs branches and lts-branches. The train
#      is read from the release train repository (the input release-train-repository). For each:
#      its version, the next one, and the release it needs, release/<version>, which must exist,
#      have joined the release train and not be ready. Everything that stops the freeze is
#      listed at once, and nothing is changed.
#   2. Apply, locally: the OSS branches first, from the OSS repository alone (a version commit,
#      after the merge across of the branch before it), and then the embargoed ones, which merge
#      the finished OSS branches down. Each frozen branch is then fast forwarded to its active one.
#   3. Check: no commit that only the commercial repository has goes to OSS, and both pushes would
#      be accepted (git push --dry-run). A dry run ends here, after it has attached the changed
#      branches to the run (a zip to look at, export-freeze).
#   4. Ready: release-train-ready.yml of the project runs on each release branch, and is waited for.
#   5. Push: the commercial repository, then OSS, each in one atomic push, without force.
#   6. Milestones: the milestone of each release is closed (none is deleted). Then the milestones of the
#      cycle are made right from the version of gradle.properties that the push left: the release before
#      it is done, the two commercial milestones that track the fixes of the active branch (the hotfix,
#      and the next release) are closed, the next OSS release and the two trackers of the new active
#      branch are made, and the commercial milestone of the next release gets the link to the OSS one.
#      This is last, so that a failed push leaves everything as it was, and the freeze can run again.
#      A dry run does the same from the versions of the plan, and writes nothing.
#
# This is a reusable workflow: the commercial repository of a project calls it from a workflow
# that is run by hand (workflow_dispatch), see docs/code-freeze.md for the caller (on its default
# branch only), and the secret. The OSS repository is the commercial one without
# -commercial. The actions are the ones of this repository, each in a directory of its own with a
# README. Nothing in this workflow is a script: what it does is in the actions.

on:
  workflow_call:
    inputs:
      release-train:
        description: "The release train of the freeze, the name of its branch in the release train repository, for example 2026.11.19"
        type: string
        required: true
      branches:
        description: "The OSS branches to freeze, separated by commas, the oldest first (7.1.x,main). Empty: all the OSS generations of the Spring projects API"
        type: string
        required: false
        default: ""
      lts-branches:
        description: "The commercial (long-term support) generations to freeze, separated by commas, the oldest first (6.4.x,6.5.x). Empty: all the commercial generations of the Spring projects API"
        type: string
        required: false
        default: ""
      dry-run:
        description: "Only plan, apply and check in a clone of the runner, and say what would be done: nothing is marked ready or pushed"
        type: boolean
        required: false
        default: true
      runs-on:
        description: "The runner of the job: a label, such as ubuntu22-2-8 for the runners of the organization. A caller that passes an empty value, as a variable that is not set is, gets the default"
        type: string
        required: false
        default: ubuntu-latest
      release-train-repository:
        description: "The repository of the release train (owner/repo). A caller that passes an empty value, as a variable that is not set is, gets the default"
        type: string
        required: false
        default: spring-io/release-train
    secrets:
      RELEASE_AUTOMATION_TOKEN:
        description: "The token that checks out and pushes the commercial repository, fetches and pushes the OSS repository, reads the release train and writes the milestones of both (Issues: Read and write), and runs release-train-ready.yml on the release branches (Actions: Read and write)"
        required: true

permissions:
  contents: read

concurrency:
  group: code-freeze-${{ github.repository }}
  cancel-in-progress: false

jobs:
  freeze:
    name: Code freeze
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    steps:
      # All the branches of the commercial repository: the embargoed ones and the release ones.
      - name: Check out the commercial repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      - name: Set the git identity
        uses: spring-io/spring-security-actions/git-identity@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
      - name: Name the repositories
        id: repositories
        uses: spring-io/spring-security-actions/name-repositories@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
      - name: List the branches to freeze
        id: branches
        uses: spring-io/spring-security-actions/list-branches@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          project: ${{ steps.repositories.outputs.project }}
          branches: ${{ inputs.branches }}
          lts-branches: ${{ inputs.lts-branches }}
      - name: Read the release train
        id: train
        uses: spring-io/spring-security-actions/load-train@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          release-train-repository: ${{ inputs.release-train-repository || 'spring-io/release-train' }}
          branch: ${{ inputs.release-train }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      - name: Plan the freeze
        id: plan
        uses: spring-io/spring-security-actions/plan-freeze@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          project: ${{ steps.repositories.outputs.project }}
          oss-repository: ${{ steps.repositories.outputs.oss-repository }}
          oss-branches: ${{ steps.branches.outputs.oss-branches }}
          lts-branches: ${{ steps.branches.outputs.lts-branches }}
          train: ${{ inputs.release-train }}
          train-found: ${{ steps.train.outputs.found }}
          train-file: ${{ steps.train.outputs.train-file }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      - name: Merge and bump the versions, locally
        uses: spring-io/spring-security-actions/apply-freeze@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
      # A dry run keeps the merges and the version commits, which end with the run: the branches are
      # attached to it, as those of the post-publish dry run are, and before the check, so that they can
      # be looked at when the check fails. It is for looking only: it has no remote and no command that
      # pushes.
      - name: Export the branches that the freeze changed
        id: export
        if: ${{ inputs.dry-run }}
        uses: spring-io/spring-security-actions/export-freeze@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          dry-run: true
      - name: Attach the changes to the run
        if: ${{ steps.export.outputs.count != '' && steps.export.outputs.count != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.export.outputs.name }}
          path: ${{ steps.export.outputs.directory }}
          include-hidden-files: true
          overwrite: true
      # Nothing from the commercial repository may reach OSS, and the pushes must be accepted: this is
      # found out before anything is marked ready, which cannot be undone.
      - name: Check that no commercial code goes to OSS, and that the pushes would be accepted
        uses: spring-io/spring-security-actions/push-freeze@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          mode: check
      - name: Mark the releases ready in the release train
        if: ${{ !inputs.dry-run }}
        uses: spring-io/spring-security-actions/ready-train@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          release-train-repository: ${{ inputs.release-train-repository || 'spring-io/release-train' }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      - name: Push the commercial repository, and then OSS
        if: ${{ !inputs.dry-run }}
        uses: spring-io/spring-security-actions/push-freeze@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          mode: push
      # Last, so that a push that failed leaves the milestones open and the freeze can run again. Every
      # milestone is closed, with open issues too, and none is deleted.
      - name: Close the milestones of the releases
        if: ${{ !inputs.dry-run }}
        uses: spring-io/spring-security-actions/close-milestones@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      # After the closing, and from the version of gradle.properties that the push left on the branches,
      # which is the one that the plan has: the same step, with the same rules, runs by hand to check the
      # milestones of a project (the workflow sync-milestone). A milestone that is right is left alone.
      - name: Make and close the milestones of the cycle
        if: ${{ !inputs.dry-run }}
        uses: spring-io/spring-security-actions/ensure-milestones@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          repository: ${{ steps.repositories.outputs.commercial-repository }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      # Nothing was bumped: the versions are the ones of the plan, and the releases of the plan are
      # taken as closed. It writes nothing.
      - name: Say what the milestones of the cycle would be
        if: ${{ inputs.dry-run }}
        uses: spring-io/spring-security-actions/ensure-milestones@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          repository: ${{ steps.repositories.outputs.commercial-repository }}
          plan-file: ${{ steps.plan.outputs.plan-file }}
          dry-run: "true"
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      - name: Summarize the freeze
        if: ${{ always() }}
        uses: spring-io/spring-security-actions/freeze-summary@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          dry-run: ${{ inputs.dry-run }}
          job-status: ${{ job.status }}
