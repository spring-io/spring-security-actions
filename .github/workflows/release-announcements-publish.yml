name: Release Announcements - Publish

on:
  workflow_call:
    inputs:
      version:
        description: The version to publish
        required: true
        type: string
    secrets:
      actions-token:
        required: true
      website-token:
        required: true

permissions:
  contents: read
concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Deploy Docs
        uses: $/dispatch-deploy-docs
  publish-release-notes:
    name: Publish Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
      - name: Publish Release Notes
        uses: spring-io/spring-release-actions/publish-release-notes@967a8de4659c4273a82bcb098d73c2330c015254 # 0.0.9
        with:
          tag: ${{ inputs.version }}
  update-learn-page:
    name: Update Learn Page
    runs-on: ubuntu-latest
    steps:
      - name: Update Learn Page
        uses: spring-io/spring-release-actions/update-learn-page@967a8de4659c4273a82bcb098d73c2330c015254 # 0.0.9
        with:
          token: ${{ secrets.actions-token }}
          version: ${{ inputs.version }}
          website-token: ${{ secrets.website-token }}
