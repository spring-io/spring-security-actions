name: sync-milestone

# Keeps the milestones of a release in step with its release train. It runs when a milestone is
# edited, in the OSS repository or in the commercial one, and what it does is in the action:
#
#   - The due date of the OSS milestone of a release (7.0.9) is the date of its release train
#     (2026-11-19 is the train 2026.11.19). The release, release/7.0.9, joins it; the hotfix,
#     release/7.0.9.1, joins it too, and its milestone is due on the commercial general availability of
#     the train. The commercial milestone of the release follows the due date.
#   - The commercial milestone of a long-term support version (5.8.30) names its train in its
#     description, `Release Train: 2026.11.19`, and is due on the commercial general availability of it.
#   - A release that was in another train leaves it first. A train that does not exist clears the due
#     date, and the description says ERROR: and why. So does a release branch that does not exist.
#   - An edit of the commercial milestone of an OSS version, or of its hotfix, is put right from the
#     OSS milestone.
#
# An edit by the user of the token is the one of this workflow, and is left alone: use a token of a
# user that no one edits milestones as.
#
# This is a reusable workflow, and it runs in the commercial repository, which has the release
# branches and the token. The commercial repository calls it from a workflow on its default branch
# (the event milestone only runs those), and the OSS repository calls that one when its milestones
# are edited: see docs/milestones.md for both callers, and the secret.

on:
  workflow_call:
    inputs:
      repository:
        description: "The repository (owner/repo) of the milestone that was edited: the OSS repository or the commercial one"
        type: string
        required: true
      milestone:
        description: "The title of the milestone that was edited, for example 7.0.9"
        type: string
        required: true
      changes:
        description: "What the edit changed, the field changes of the event (toJSON(github.event.changes)). Empty for a run by hand"
        type: string
        required: false
        default: ""
      sender:
        description: "Who made the edit (github.event.sender.login). An edit by the user of the token is left alone"
        type: string
        required: false
        default: ""
      release-train-repository:
        description: "The release train repository (owner/repo). A caller that passes an empty value, as a variable that is not set is, gets the default"
        type: string
        required: false
        default: spring-io/release-train
      runs-on:
        description: "The runner of the job: a label, such as ubuntu22-2-8 for the runners of the organization. A caller that passes an empty value gets the default"
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      RELEASE_AUTOMATION_TOKEN:
        description: "The token that writes the milestones of both repositories (Issues: Read and write), reads the release train repository (Contents: Read-only), and runs the workflows Release Train - Join and Leave on the release branches (Actions: Read and write)"
        required: true

permissions:
  contents: read

# One edit after the other, in the order they were made: an edit that waited would be replaced by
# the next one, and with it what it changed (the train that the release has to leave) would be lost.
# A group belongs to the repository that calls this workflow. A caller must not have a group of the
# same name: that cancels the caller.
concurrency:
  group: sync-milestone
  queue: max

jobs:
  sync-milestone:
    name: Sync the milestone
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    steps:
      - name: Sync the milestone
        uses: spring-io/spring-security-actions/sync-milestone@d353ddb5cc40a92e705d20369b69c30c778e606a # 0.0.27
        with:
          repository: ${{ inputs.repository }}
          milestone: ${{ inputs.milestone }}
          changes: ${{ inputs.changes }}
          sender: ${{ inputs.sender }}
          release-train-repository: ${{ inputs.release-train-repository || 'spring-io/release-train' }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
