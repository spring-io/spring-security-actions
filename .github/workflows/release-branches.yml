name: release-branches

# Every push to an embargoed branch builds the branches of its release. They are built
# again from the pushed commit every time, and nobody commits to them:
#
#   embargoed/frozen/<generation>   the release of the version of the branch
#     release/<release version>               the release: the dependencies the release
#                                             train asks for, and the version of the release
#     embargoed/<version>-INTERNAL-SNAPSHOT  a snapshot of the version, with internal
#                                             snapshots of the dependencies. It is thrown away
#
#   embargoed/active/<generation>   the hotfix of the version of the branch: the release
#                                    of that version, and the fixes of the active embargoed branch
#     embargoed/<hotfix>-SNAPSHOT            the snapshot of the release merged in
#                                             (embargoed/<version>-INTERNAL-SNAPSHOT, if it
#                                             exists), the commercial license and headers,
#                                             the hotfix version, and snapshots of the
#                                             dependencies that have a hotfix
#     release/<hotfix>                        the release of the hotfix, from the pushed commit,
#                                             with the release merged in (release/<version>, if
#                                             it exists), the commercial license and headers,
#                                             the dependencies that have a hotfix, and the version
#   embargoed/lts/<generation>      a long-term support release of the version of the branch
#     embargoed/<version>-SNAPSHOT            a snapshot of the version, from the pushed commit, with
#                                             snapshots of the dependencies that have joined the train
#     release/<release version>               the release, as for a frozen branch, from the pushed
#                                             commit. The branch is commercial, so its milestone
#                                             and the issues of its dependency updates are in the
#                                             commercial repository, and it is deployed to
#                                             Spring Enterprise. Its milestone names its release
#                                             train in its description (Release Train: 2026.10.22),
#                                             and its due date is set to the commercial general
#                                             availability of that train
#   A hotfix is only built if the active embargoed branch has changes that the frozen one of
#   its generation lacks. If it has none (right after the frozen one was merged into it),
#   nothing is built, and the milestone of the hotfix is not looked for.
#
# The milestone of the release (in the OSS repository, or for a hotfix in the commercial one)
# is looked for in the plan job, before anything is built. A version whose milestone does not
# exist is created, with a title and nothing else (no due date, no Release Train line). A release
# with no due date (or, for long-term support, no Release Train line), and a hotfix whose OSS
# milestone has no due date, is built all the same, without a release train: no dependency
# updates, and nothing joins, with the notice No release train. Built again once it has a train (the
# nightly run does it), it gets the updates, and joins.
#
# What the release train asks for is read from the release train repository, from the
# branch of the date that the milestone of the release is due (for a hotfix, the milestone of the
# release it fixes in the OSS repository: its own due date is its commercial availability, after
# the train that builds it). The milestone of a long-term support version in the commercial
# repository names its train with a line of its description (Release Train: 2026.10.22): it has
# no other way, as it is due on the commercial availability of the train, which is not the date
# of the train. Only a commercial version names its train. If the train does not exist (yet), the
# branches are built without the dependency updates. A release that is ready in the
# train is not changed: the run fails, and says what to do.
#
# Once the branches are pushed, the release joins the train, if the train exists and has not
# got the release yet: the workflow Release Train - Join of the project runs on the release
# branch (it runs Join in the release train repository). The due date of the milestone of a
# hotfix or a long-term support version is set to the commercial-general-availability of the
# train first. The milestone says which train it is in, in its description (Release Train:
# 2026.11.19), or what is wrong (ERROR: ...): see docs/milestones.md.
# The workflow can be run by hand (workflow_dispatch of the caller) on an embargoed branch, for
# example after the due date of a milestone was set: what has joined is not joined again.
#
# This is a reusable workflow: a project calls it from a workflow that is triggered by the
# push of the embargoed branches (see docs/release-branches.md for the caller, the secret
# and the variable it needs). The actions are the ones of this repository, each in a
# directory of its own with a README. The jobs run on the runner that the caller gives
# (runs-on), ubuntu-latest if it gives none: a private or internal repository gives the
# label of the runners of its organization, as GitHub bills the others to the account.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "The runner of the jobs: a label, such as ubuntu22-2-8 for the runners of the organization. A caller that passes an empty value, as a variable that is not set is, gets the default"
        type: string
        required: false
        default: ubuntu-latest
      release-train-repository:
        description: "The repository of the release train (owner/repo). A caller that passes an empty value, as a variable that is not set is, gets the default"
        type: string
        required: false
        default: spring-io/release-train
      snapshot-suffix-overrides:
        description: "Which snapshots of the dependencies are -SNAPSHOT or -INTERNAL-SNAPSHOT instead of what the kind of the release gives (-INTERNAL-SNAPSHOT, -SNAPSHOT for a hotfix and a long-term support version). One rule per line: <project>=<suffix> or <project>@<version>=<suffix>, the version being one of the project in the release train (7.0.10.1) or its generation (7.0.x). Empty for none"
        type: string
        required: false
        default: ""
    secrets:
      RELEASE_AUTOMATION_TOKEN:
        description: "The token that checks out and pushes the commercial repository (so that the push runs the workflows of the new branches), reads the release train, reads the milestone of a hotfix and creates the issues of its dependency updates in the commercial repository, and creates the issues of the other releases in the OSS repository"
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    outputs:
      release: ${{ steps.plan.outputs.release == 'true' && (steps.plan.outputs.kind != 'active' || steps.compare.outputs.different == 'true') && steps.release.outputs.found != 'false' && steps.train-milestone.outputs.found != 'false' }}
      kind: ${{ steps.plan.outputs.kind }}
      base-version: ${{ steps.plan.outputs.base-version }}
      hotfix: ${{ steps.plan.outputs.hotfix }}
      hotfix-of-snapshot: ${{ steps.plan.outputs.hotfix-of-snapshot }}
      hotfix-of-release: ${{ steps.plan.outputs.hotfix-of-release }}
      oss-branch: ${{ steps.plan.outputs.oss-branch }}
      oss-tag: ${{ steps.plan.outputs.oss-tag }}
      snapshot-branch: ${{ steps.plan.outputs.snapshot-branch }}
      snapshot-version: ${{ steps.plan.outputs.snapshot-version }}
      release-version: ${{ steps.release.outputs.release-version }}
      due-date: ${{ steps.release.outputs.due-date }}
      deployment-destination: ${{ steps.plan.outputs.deployment-destination }}
      train-date: ${{ steps.train-milestone.outputs.due-date || steps.release.outputs.due-date }}
      train-branch: ${{ steps.plan.outputs.kind != 'frozen' && steps.release.outputs.release-train || '' }}
      milestone-url: ${{ steps.release.outputs.milestone-url }}
      project: ${{ steps.repositories.outputs.project }}
      oss-repository: ${{ steps.repositories.outputs.oss-repository }}
    steps:
      # With the branches of the remote: an active embargoed branch is compared with the frozen one.
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the version
        id: version
        uses: spring-io/spring-release-actions/compute-version@967a8de4659c4273a82bcb098d73c2330c015254 # 0.0.9
      - name: Decide what to build
        id: plan
        uses: spring-io/spring-security-actions/plan-release-branches@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          ref-name: ${{ github.ref_name }}
          version: ${{ steps.version.outputs.version }}
      # A hotfix is the release plus the fixes of the active embargoed branch, so there is
      # nothing to build for an active embargoed branch that has no changes that the frozen one
      # lacks (right after the frozen one was merged into it, for example). That is decided here,
      # before the milestone of the hotfix is looked for: it needs none if there is nothing to build.
      - name: Compare the active embargoed branch with the frozen one
        id: compare
        if: steps.plan.outputs.kind == 'active' && steps.plan.outputs.release == 'true'
        uses: spring-io/spring-security-actions/compare-branches@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          base: ${{ steps.plan.outputs.frozen-branch }}

      # Only if there is something to build, so that a run with nothing to build makes no request.
      # The embargoed branches only exist in the commercial repository, spring-security-commercial.
      # The project of the release train, and the OSS repository with the milestones and the
      # issues of the releases, are named after it. A hotfix is only released from the commercial
      # repository, so its milestone and the issues of its dependency updates are in that one.
      - name: Name the repositories
        id: repositories
        if: steps.plan.outputs.release == 'true' && (steps.plan.outputs.kind != 'active' || steps.compare.outputs.different == 'true')
        uses: spring-io/spring-security-actions/name-repositories@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
      # A hotfix is in the release train of its OSS equivalent: the train that the milestone of the
      # release it fixes (7.0.1 for 7.0.1.1) is due. The due date of the milestone of the hotfix is
      # when it is commercially available, and that is after the train that builds it. Like the
      # milestone of a release, if it does not exist, nothing is built, and the run ends with a notice and
      # a summary that says to create it, with a due date on the date of a train. Without a due date, it fails.
      # The hotfix of a .0 version is only built for the GA (7.2.0), and not for 7.2.0-RC1, so this is
      # looked at before the milestone of the hotfix, which is not created if there is no release.
      # The milestone of the hotfix is created even if the OSS milestone has no due date, so this
      # step does not ask for one: the step after the milestone of the hotfix does, and fails.
      - name: Work out the date of the release train of the hotfix
        id: train-milestone
        if: steps.plan.outputs.kind == 'active' && steps.plan.outputs.release == 'true' && steps.compare.outputs.different == 'true'
        uses: spring-io/spring-security-actions/compute-release-version@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          snapshot-version: ${{ format('{0}-SNAPSHOT', steps.plan.outputs.hotfix-of-version) }}
          milestone-repository: ${{ steps.repositories.outputs.oss-repository }}
          milestone-token: ${{ secrets.GITHUB_TOKEN }}
          release-only: "true"
          require-due-date: "false"
          fail-if-missing: "false"
          kind: ${{ steps.plan.outputs.kind }}
      # If the milestone does not exist, it is created, with a title and nothing else: no due date
      # and no release train. That is no reason not to build: a release that is not in a train is
      # built all the same, without the dependency updates of a train and without joining one, with
      # the notice No release train. That of a hotfix has its due date set from the OSS milestone,
      # once there is a train. Built again once it has one, it gets the updates, and joins.
      - name: Work out the release version
        id: release
        if: steps.plan.outputs.release == 'true' && (steps.plan.outputs.kind != 'active' || steps.compare.outputs.different == 'true') && steps.train-milestone.outputs.no-release != 'true'
        uses: spring-io/spring-security-actions/compute-release-version@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          snapshot-version: ${{ steps.plan.outputs.base-version }}
          milestone-repository: ${{ steps.plan.outputs.kind != 'frozen' && github.repository || steps.repositories.outputs.oss-repository }}
          milestone-token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          create-missing: "true"
          fail-if-missing: "false"
          kind: ${{ steps.plan.outputs.kind }}
          # Neither a due date (the date of the train, or for a hotfix its commercial availability) nor,
          # for long-term support, the line of the description (Release Train: 2026.10.22) is needed to
          # build: without them it is built without a train
          require-due-date: "false"
          require-release-train: "false"
      # Every OSS version is a milestone of the commercial repository too, due when the OSS one is,
      # and following it if that changes: the issues of the fixes that only customers get (for a CVE)
      # need the milestone of the version. It is made once the OSS milestone has a due date, and
      # its description says that it is the OSS one, with a link to it (only when it is created).
      - name: Make the milestone of the OSS version in the commercial repository
        if: steps.plan.outputs.kind == 'frozen' && steps.release.outputs.found == 'true'
        uses: spring-io/spring-security-actions/ensure-milestone@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          repository: ${{ github.repository }}
          milestone: ${{ steps.release.outputs.release-version }}
          due-date: ${{ steps.release.outputs.due-date }}
          description: "${{ format('OSS milestone: {0}', steps.release.outputs.milestone-url) }}"
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      # A frozen or active embargoed branch is for a generation that is still OSS when the release
      # is made public (the date of its train). Once it is commercial, it has one embargoed/lts branch.
      - name: Check that the generation is still supported as OSS
        if: steps.plan.outputs.kind != 'lts' && steps.release.outputs.found == 'true' && steps.train-milestone.outputs.found != 'false' && (steps.train-milestone.outputs.due-date || steps.release.outputs.due-date) != ''
        uses: spring-io/spring-security-actions/check-oss-support@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          project: ${{ steps.repositories.outputs.project }}
          version: ${{ steps.release.outputs.release-version }}
          date: ${{ steps.train-milestone.outputs.due-date || steps.release.outputs.due-date }}
          branch: ${{ github.ref_name }}

  build:
    name: Build the branches
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    env:
      KIND: ${{ needs.plan.outputs.kind }}
      HOTFIX: ${{ needs.plan.outputs.hotfix }}
      HOTFIX_OF_SNAPSHOT: ${{ needs.plan.outputs.hotfix-of-snapshot }}
      HOTFIX_OF_RELEASE: ${{ needs.plan.outputs.hotfix-of-release }}
      BASE_VERSION: ${{ needs.plan.outputs.base-version }}
      SNAPSHOT_BRANCH: ${{ needs.plan.outputs.snapshot-branch }}
      SNAPSHOT_VERSION: ${{ needs.plan.outputs.snapshot-version }}
      DEPLOYMENT_DESTINATION: ${{ needs.plan.outputs.deployment-destination }}
    steps:
      # Everything is built in this checkout, and only the push at the end is seen by
      # anybody. The token is that of the push, which makes the push run the workflows
      # of the new branches, as the push of a person does. The token of the workflow does not.
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          fetch-depth: 0
      - name: Set the git identity
        uses: spring-io/spring-security-actions/git-identity@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
      # The train is the one that the description of the milestone names (Release Train: 2026.10.22),
      # which a long-term support version needs. Without one, it is the one that the milestone of the
      # release is due (for a hotfix, the milestone of the release it fixes). If it has not been
      # created, that is said in a notice, and the branches are built without the dependencies.
      - name: Read the release train
        id: train
        if: needs.plan.outputs.train-branch != '' || needs.plan.outputs.train-date != ''
        uses: spring-io/spring-security-actions/load-train@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          release-train-repository: ${{ inputs.release-train-repository || 'spring-io/release-train' }}
          branch: ${{ needs.plan.outputs.train-branch }}
          date: ${{ needs.plan.outputs.train-branch == '' && needs.plan.outputs.train-date || '' }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      # The due date of the milestone of a hotfix or of a long-term support version is the commercial
      # availability of the train: it is corrected here if it is not, or if it has none.
      - name: Set the due date of the milestone
        if: env.KIND != 'frozen' && steps.train.outputs.found == 'true'
        uses: spring-io/spring-security-actions/align-milestone@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          train-file: ${{ steps.train.outputs.train-file }}
          train-branch: ${{ steps.train.outputs.branch }}
          milestone-repository: ${{ github.repository }}
          milestone: ${{ needs.plan.outputs.release-version }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      - name: Stop if the release is ready already
        id: not-ready
        if: steps.train.outputs.found == 'true'
        uses: spring-io/spring-security-actions/check-not-ready@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          train-file: ${{ steps.train.outputs.train-file }}
          project: ${{ needs.plan.outputs.project }}
          version: ${{ needs.plan.outputs.release-version }}
          train-branch: ${{ steps.train.outputs.branch }}
          train-url: ${{ format('{0}/{1}/tree/{2}', github.server_url, inputs.release-train-repository || 'spring-io/release-train', steps.train.outputs.branch) }}
          train-state-url: ${{ format('{0}/{1}/blob/{2}/train.yml#L1', github.server_url, inputs.release-train-repository || 'spring-io/release-train', steps.train.outputs.branch) }}

      # The snapshot branch: from the pushed commit. A hotfix has the release merged in, and
      # then the commercial license and headers. Then its version (a long-term support branch has it
      # already), and the dependencies that have joined the release train, as snapshots. Nothing of
      # that has an issue: it is thrown away, or replaced. The snapshot of a hotfix or of a
      # long-term support version is a plain -SNAPSHOT, and only OSS has an internal one: it
      # publishes a regular snapshot without the fixes for vulnerabilities that the commercial one has.
      - name: Start the snapshot branch
        uses: spring-io/spring-security-actions/start-branch@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          branch: ${{ env.SNAPSHOT_BRANCH }}
          from: ${{ github.sha }}
      # The snapshot of a hotfix is the snapshot of the release plus the fixes of the active
      # embargoed branch, so it starts with the snapshot of the release merged in
      # (embargoed/7.0.1-INTERNAL-SNAPSHOT).
      - name: Merge the snapshot of the release into the snapshot of the hotfix
        id: merge-snapshot
        if: env.KIND == 'active'
        uses: spring-io/spring-security-actions/merge-release@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          release: ${{ env.HOTFIX_OF_SNAPSHOT }}
      - name: Apply the commercial license
        if: env.KIND == 'active'
        uses: spring-io/spring-security-actions/apply-commercial-license@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          commit-message: Commercial changes for ${{ needs.plan.outputs.release-version }}
      - name: Set the version of the snapshot
        if: env.KIND != 'lts'
        uses: spring-io/spring-security-actions/set-version@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          version: ${{ env.SNAPSHOT_VERSION }}
          message: Set the version to ${{ env.SNAPSHOT_VERSION }}
      - name: Work out the snapshots of the dependencies
        id: snapshot-versions
        if: steps.train.outputs.found == 'true'
        uses: spring-io/spring-security-actions/map-train-versions@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          release-versions-file: ${{ steps.train.outputs.release-versions-file }}
          train-file: ${{ steps.train.outputs.train-file }}
          prefer-hotfix: ${{ env.HOTFIX }}
          suffix: ${{ env.KIND == 'lts' && '-SNAPSHOT' || '-INTERNAL-SNAPSHOT' }}
          hotfix-suffix: -SNAPSHOT
          snapshot-suffix-overrides: ${{ inputs.snapshot-suffix-overrides }}
      - name: Update the dependencies of the snapshot
        if: steps.train.outputs.found == 'true'
        uses: spring-io/spring-security-actions/update-versions@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          versions: ${{ steps.snapshot-versions.outputs.versions }}
          require-issue: "false"

      # The release branch: from the pushed commit, and not from the snapshot branch, which has the
      # snapshots of the dependencies. A hotfix is the release plus the fixes of the active
      # embargoed branch, so it starts with the release merged in (release/7.0.1), and then the
      # commercial license. The versions of the dependencies of the release come with it: a
      # dependency that has no hotfix is left at the version that the release has. Then the
      # dependencies of the release train, each with an issue and a commit, and the version of the
      # release, last.
      - name: Start the release branch
        uses: spring-io/spring-security-actions/start-branch@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          branch: release/${{ needs.plan.outputs.release-version }}
          from: ${{ github.sha }}
      - name: Merge the release into the hotfix
        id: merge-release
        if: env.KIND == 'active'
        uses: spring-io/spring-security-actions/merge-release@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          release: ${{ env.HOTFIX_OF_RELEASE }}
      - name: Apply the commercial license to the hotfix
        if: env.KIND == 'active'
        uses: spring-io/spring-security-actions/apply-commercial-license@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          commit-message: Commercial changes for ${{ needs.plan.outputs.release-version }}
      - name: Work out the versions of the dependencies
        id: versions
        if: steps.train.outputs.found == 'true'
        uses: spring-io/spring-security-actions/map-train-versions@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          release-versions-file: ${{ steps.train.outputs.release-versions-file }}
          train-file: ${{ steps.train.outputs.train-file }}
          prefer-hotfix: ${{ env.HOTFIX }}
      # The issues of a frozen branch are in the OSS repository, in the OSS milestone, and are left open:
      # their commits close them when they are merged. Those of a hotfix or of an LTS version are in this
      # repository, and are created closed, as their commits are made below. An update that left the train
      # since an earlier run is taken out of the milestone, with a comment.
      - name: Make sure that there are issues
        id: issues
        if: steps.train.outputs.found == 'true'
        uses: spring-io/spring-security-actions/ensure-dependency-issues@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          versions: ${{ steps.versions.outputs.versions }}
          repository: ${{ env.KIND != 'frozen' && github.repository || needs.plan.outputs.oss-repository }}
          milestone: ${{ needs.plan.outputs.release-version }}
          close: ${{ env.KIND != 'frozen' }}
          labels: "type: dependency-upgrade"
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      - name: Update the dependencies of the release
        if: steps.train.outputs.found == 'true'
        uses: spring-io/spring-security-actions/update-versions@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          versions: ${{ steps.issues.outputs.updates }}
      - name: Set the version of the release
        uses: spring-io/spring-security-actions/set-version@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          version: ${{ needs.plan.outputs.release-version }}
          message: Release ${{ needs.plan.outputs.release-version }}

      # Both at once, or none: so a failure never leaves one of them built and not the other.
      # It is forced, because the branches are built again from the pushed commit every time.
      - name: Push the branches
        uses: spring-io/spring-security-actions/push-branches@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          kind: ${{ env.KIND }}
          oss-repository: ${{ needs.plan.outputs.oss-repository }}
          oss-branch: ${{ needs.plan.outputs.oss-branch }}
          oss-tag: ${{ needs.plan.outputs.oss-tag }}
          snapshot-of: ${{ env.HOTFIX_OF_SNAPSHOT }}
          release-of: ${{ env.HOTFIX_OF_RELEASE }}
          merged-snapshot: ${{ steps.merge-snapshot.outputs.merged }}
          merged-release: ${{ steps.merge-release.outputs.merged }}
          milestone-url: ${{ needs.plan.outputs.milestone-url }}
          train: ${{ steps.train.outputs.found == 'true' && steps.train.outputs.branch || '' }}
          train-url: ${{ steps.train.outputs.found == 'true' && format('{0}/{1}/tree/{2}', github.server_url, inputs.release-train-repository || 'spring-io/release-train', steps.train.outputs.branch) || '' }}
          train-status: ${{ steps.not-ready.outputs.status }}
          train-state: ${{ steps.not-ready.outputs.train-state }}
          train-state-url: ${{ format('{0}/{1}/blob/{2}/train.yml#L1', github.server_url, inputs.release-train-repository || 'spring-io/release-train', steps.train.outputs.branch) }}
          branches: |
            release/${{ needs.plan.outputs.release-version }}=${{ needs.plan.outputs.release-version }}
            ${{ env.SNAPSHOT_BRANCH && format('{0}={1}', env.SNAPSHOT_BRANCH, env.SNAPSHOT_VERSION) }}

      # The release has joined the train once its branches are pushed (the train builds the release
      # branch), a train exists, and the milestone has its due date: the one of the train for a
      # release, the one that was set above for a hotfix. A release that has joined is not joined
      # again, so a run by hand after the due date of a milestone was set joins what was missed.
      - name: Join the release train
        if: steps.train.outputs.found != ''
        uses: spring-io/spring-security-actions/join-train@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          release-train-repository: ${{ inputs.release-train-repository || 'spring-io/release-train' }}
          train-branch: ${{ steps.train.outputs.branch }}
          train-found: ${{ steps.train.outputs.found }}
          train-file: ${{ steps.train.outputs.train-file }}
          train-url: ${{ format('{0}/{1}/tree/{2}', github.server_url, inputs.release-train-repository || 'spring-io/release-train', steps.train.outputs.branch) }}
          project: ${{ needs.plan.outputs.project }}
          version: ${{ needs.plan.outputs.release-version }}
          release-repository: ${{ github.repository }}
          release-branch: release/${{ needs.plan.outputs.release-version }}
          deployment-destination: ${{ env.DEPLOYMENT_DESTINATION }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      # The milestone says which train the release is in (Release Train: 2026.11.19), and what is wrong
      # if it cannot be (ERROR: ...): the workflow sync-milestone does that when a milestone is edited,
      # and this is the same for a release that joined here. It joins and leaves nothing: it was joined
      # above, and the line of an earlier run that could not join is replaced.
      - name: Write the release train in the milestones
        if: ${{ steps.train.outputs.found == 'true' }}
        uses: spring-io/spring-security-actions/sync-milestone@e2727756d052a300d45a870a8dba835b3f3db271 # 0.0.32
        with:
          repository: ${{ env.KIND == 'frozen' && needs.plan.outputs.oss-repository || github.repository }}
          milestone: ${{ needs.plan.outputs.release-version }}
          release-train-repository: ${{ inputs.release-train-repository || 'spring-io/release-train' }}
          dispatch: "false"
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
