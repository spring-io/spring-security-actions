name: post-publish

# What is done after a release was made public, which is days after it was built, once its tag
# is pushed (the tag is the release version, 7.1.3). The branches of the release that were built
# for the testing and the staging are not needed any more, and the fixes that the tag made public
# have to reach the newer branches:
#
#   1. Plan (read-only): the kind of the release (an OSS release, a hotfix or a long-term support
#      one), whether its issues are copied, the branches to delete, and the branches that the tag is
#      merged forward through, which come from the generations of the Spring projects API. Everything
#      that stops it is listed at once, and nothing is changed.
#   2. Back-up: a clone with the branches that are to be deleted, uploaded as an artifact of this run
#      (restore-deleted-branches-<tag>), with the commands that put them back.
#   3. Copy: the issues of the milestone of the tag are copied from the commercial repository to
#      the OSS one, for an OSS release only, without their body.
#   4. Merge: the tag is merged into its branch, and forward, in a clone: the OSS branches, and then
#      the frozen and active ones, or the long-term support ones. A hotfix is not merged. A dry run
#      attaches the merged branches to the run (merged-branches-<tag>), to look at.
#   5. Check and push: no commercial code goes to OSS, and the pushes would be accepted
#      (git push --dry-run). A dry run ends here. Then OSS is pushed, and then the commercial
#      repository, each in one atomic push, without force.
#   6. Delete: release/<version> and the snapshot branch, in one atomic push.
#
# This is a reusable workflow: the repository of a project, the OSS one or the commercial one, calls
# it from a workflow that runs when a tag is pushed, and by hand (workflow_dispatch) with the tag as
# an input (and, for a dry run before the tag exists, a ref that stands in for it), see docs/post-publish.md for the callers and the secret. The work is always done in the
# commercial repository, which is the OSS one with -commercial. The actions are the ones of this
# repository, each in a directory of its own with a README. Nothing in this workflow is a script: what
# it does is in the actions.
#
# Besides the job post-publish, which does all of the above, the workflow has the jobs that make
# the release known, and that do not depend on it:
#
#   deploy-docs            dispatches the workflow deploy-docs.yml of the project on docs-build
#   publish-release-notes  the changelog of the milestone of the tag, as the GitHub release
#   update-learn-page      adds the release to the #learn page: an OSS release through the Spring
#                          Projects API, and any other (lts, hotfix, internal) by editing
#                          documentation.json in spring-website-commercial-content

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag of the release, which is its version, for example 7.1.3"
        type: string
        required: true
      ref:
        description: "A branch or a commit of the commercial repository that stands in for the tag, for a dry run before the tag exists, for example release/7.1.3. Only with dry-run, and only while the tag does not exist: a real run always uses the tag"
        type: string
        required: false
        default: ""
      dry-run:
        description: "Only plan, back up, and make the merges in a clone of the runner, and say what would be done: nothing is copied, pushed or deleted"
        type: boolean
        required: false
        default: true
      runs-on:
        description: "The runner of the job: a label, such as ubuntu22-2-8 for the runners of the organization. A caller that passes an empty value, as a variable that is not set is, gets the default"
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      RELEASE_AUTOMATION_TOKEN:
        description: "The token that checks out and pushes the commercial repository, pushes the OSS repository, and reads and writes the issues and the labels of both (Contents: Read and write, Issues: Read and write, on both repositories)"
        required: true
      GH_WEBSITE_COMMERCIAL_CONTENT_TOKEN:
        description: "The token that edits documentation.json in spring-website-commercial-content. A commercial release needs it (the action fails without it); an OSS release has none, and updates the Spring Projects API instead"
        required: false
      GH_ACTIONS_REPO_TOKEN:
        description: "The token that authenticates the update of the Spring Projects API, which is what an OSS release uses for the #learn page"
        required: false

permissions:
  contents: read

# The runs of all the tags of a project wait for one another, as each one changes the same branches:
# the group has no tag in it, and queue: max lets up to 100 runs wait, in the order they arrived,
# where by default a run that waits is replaced by the next one and a tag would be lost. A group
# belongs to the repository that calls this workflow, so a project is one queue, and the name needs no
# repository in it. A caller must not have a group of the same name: that cancels the caller. See
# docs/post-publish.md.
concurrency:
  group: post-publish
  queue: max

jobs:
  post-publish:
    name: Post publish
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    steps:
      - name: Name the repositories
        id: repositories
        uses: spring-io/spring-security-actions/name-repositories@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27
      # All the branches of the commercial repository, and no credentials left in the checkout: the
      # back-up is uploaded, and the actions that push have the token of their own.
      - name: Check out the commercial repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.repositories.outputs.commercial-repository }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          persist-credentials: false
      - name: Set the git identity
        uses: spring-io/spring-security-actions/git-identity@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27
      - name: Work out the versions of the tag
        id: versions
        uses: spring-io/spring-security-actions/compute-tag-versions@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27
        with:
          tag: ${{ inputs.tag }}
      - name: Plan what is done
        id: plan
        uses: spring-io/spring-security-actions/plan-post-publish@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27
        with:
          release-version: ${{ steps.versions.outputs.release-version }}
          base-version: ${{ steps.versions.outputs.base-version }}
          generation: ${{ steps.versions.outputs.generation }}
          hotfix: ${{ steps.versions.outputs.hotfix }}
          oss-repository: ${{ steps.repositories.outputs.oss-repository }}
          commercial-repository: ${{ steps.repositories.outputs.commercial-repository }}
          project: ${{ steps.repositories.outputs.project }}
          dry-run: ${{ inputs.dry-run }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      # Before anything is changed: the branches that are deleted last are the ones that are backed up.
      - name: Back up the branches that are deleted
        id: backup
        uses: spring-io/spring-security-actions/backup-branches@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27
        with:
          repository: ${{ steps.repositories.outputs.commercial-repository }}
          branches: ${{ steps.plan.outputs.delete-branches }}
          name: restore-deleted-branches-${{ inputs.tag }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      # An artifact of this run, not of the repository. It is a .git directory, so hidden files are in.
      - name: Attach the back-up to the run
        if: ${{ steps.backup.outputs.count != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.backup.outputs.name }}
          path: ${{ steps.backup.outputs.directory }}
          include-hidden-files: true
          overwrite: true
      - name: Copy the issues of the milestone to the OSS repository
        if: ${{ steps.plan.outputs.copy == 'true' }}
        uses: spring-io/spring-security-actions/copy-milestone-issues@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27
        with:
          source-repository: ${{ steps.repositories.outputs.commercial-repository }}
          destination-repository: ${{ steps.repositories.outputs.oss-repository }}
          milestone: ${{ inputs.tag }}
          dry-run: ${{ inputs.dry-run }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      - name: Merge the tag into its branch, and forward, locally
        if: ${{ steps.plan.outputs.merge != 'none' }}
        uses: spring-io/spring-security-actions/merge-tag@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27
        with:
          dry-run: ${{ inputs.dry-run }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      # A dry run keeps the merges, which end with the run: the branches are attached to it, as the
      # back-up is, and before the check, so that they can be looked at when the check fails. It is
      # for looking only: it has no remote and no command that pushes.
      - name: Export the merged branches
        id: export
        if: ${{ steps.plan.outputs.merge != 'none' && inputs.dry-run }}
        uses: spring-io/spring-security-actions/export-merges@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27
        with:
          name: merged-branches-${{ inputs.tag }}
          dry-run: true
      - name: Attach the merged branches to the run
        if: ${{ steps.export.outputs.count != '' && steps.export.outputs.count != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.export.outputs.name }}
          path: ${{ steps.export.outputs.directory }}
          include-hidden-files: true
          overwrite: true
      # Nothing from the commercial repository may reach OSS, and the pushes must be accepted.
      - name: Check that no commercial code goes to OSS, and that the pushes would be accepted
        if: ${{ steps.plan.outputs.merge != 'none' }}
        uses: spring-io/spring-security-actions/push-merges@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27
        with:
          mode: check
          summary: ${{ inputs.dry-run }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      - name: Push OSS, and then the commercial repository
        if: ${{ steps.plan.outputs.merge != 'none' && !inputs.dry-run }}
        uses: spring-io/spring-security-actions/push-merges@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27
        with:
          mode: push
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      # Last: a branch that failed to be copied or merged is not deleted, and the run can be made again.
      - name: Delete the branches of the release
        uses: spring-io/spring-security-actions/delete-branches@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27
        with:
          repository: ${{ steps.repositories.outputs.commercial-repository }}
          branches: ${{ steps.plan.outputs.delete-branches }}
          dry-run: ${{ inputs.dry-run }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}

  deploy-docs:
    name: Deploy Docs
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    permissions:
      actions: write
    steps:
      - name: Dispatch Deploy Docs
        uses: spring-io/spring-security-actions/dispatch-deploy-docs@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27

  publish-release-notes:
    name: Publish Release Notes
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Publish Release Notes
        uses: spring-io/spring-security-actions/publish-release-notes@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.27
        with:
          tag: ${{ inputs.tag }}

  update-learn-page:
    name: Update Learn Page
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    steps:
      - name: Update Learn Page
        uses: spring-io/spring-release-actions/update-learn-page@967a8de4659c4273a82bcb098d73c2330c015254 # 0.0.9
        with:
          token: ${{ secrets.GH_ACTIONS_REPO_TOKEN }}
          version: ${{ inputs.tag }}
          website-token: ${{ secrets.GH_WEBSITE_COMMERCIAL_CONTENT_TOKEN }}
