name: "compute-release-version"
description: "Works out the version a snapshot version is released as, and its due date, from the milestones of a repository"

inputs:
  snapshot-version:
    description: "The snapshot version of the project, for example 7.0.1-SNAPSHOT or 7.1.0-SNAPSHOT"
    required: true
  milestone-repository:
    description: "The repository (owner/repo) whose milestones decide the release version and its due date"
    required: true
  milestone-token:
    description: "A token that can read the milestones of the repository. GITHUB_TOKEN is enough for a public repository"
    required: false
  require-due-date:
    description: "Whether the milestone must have a due date. Set to false to allow it not to"
    required: false
    default: "true"
  release-only:
    description: "Whether a .0 version is only found if its next release is the version itself (7.2.0), and not a milestone (7.2.0-M1) or a release candidate (7.2.0-RC1): it ends as if there were no milestone, with the notice that says so. A hotfix is only made of the release itself"
    required: false
    default: "false"
  require-release-train:
    description: "Whether the description of the milestone must name its release train, with a line `Release Train: 2026.11.19`: the release workflow requires it for a long-term support version. Set to false to allow it not to"
    required: false
    default: "false"
  kind:
    description: "The kind of branch that is built: frozen, active or lts. It decides what the summary tells to do when the milestone does not exist or is not in a release train: a due date for frozen (OSS) and active (the hotfix of an OSS version), the line `Release Train: 2026.11.19` of the description for lts (commercial)"
    required: false
    default: "frozen"
  create-missing:
    description: "Whether to create the milestone if it does not exist, with a title and nothing else (no due date, no release train). A hotfix (kind active) goes on with it: it needs neither. It is made and used for every kind: its branches are built without a release train, with the notice No release train, until it has one. The token must be allowed to create milestones in the repository"
    required: false
    default: "false"
  fail-if-missing:
    description: "Whether the action fails if the milestone does not exist. Set to false to end with a notice instead, and the output found set to false. The notice of release-only (No release) never fails"
    required: false
    default: "true"

outputs:
  release-version:
    description: "The version the snapshot version is released as, the title of its milestone (for example 7.0.1 or 7.1.0-RC1)"
  due-date:
    description: "The due date of that milestone, as a date in UTC (YYYY-MM-DD). Empty if it has none and require-due-date is false"
  release-train:
    description: "The release train that the description of the milestone names with a line `Release Train: 2026.11.19` (the name of its branch in the release train repository). Empty if it names none"
  milestone-url:
    description: "The URL of that milestone on GitHub. Empty if it does not exist"
  no-release:
    description: "true if release-only found a .0 version whose next release is a milestone or a release candidate (the notice No release), false otherwise: a version that is not built, as opposed to a milestone that does not exist"
  found:
    description: "true if the milestone exists, false if it does not and fail-if-missing is false. Then release-version and due-date are empty"

runs:
  using: "node24"
  main: "dist/index.js"
