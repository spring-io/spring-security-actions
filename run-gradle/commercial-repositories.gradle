/*
 * Adds the Spring commercial Maven repositories after the repositories that the build
 * declares, so the build keeps its own order (its mavenCentral() first, and only once) and
 * these are asked only for what the repositories before them do not have.
 *
 * Active only when Artifactory credentials are set: the Gradle properties artifactoryUsername
 * and artifactoryPassword (for example from the environment variables
 * ORG_GRADLE_PROJECT_artifactoryUsername and ORG_GRADLE_PROJECT_artifactoryPassword), falling
 * back to the environment variables COMMERCIAL_REPO_USERNAME and COMMERCIAL_REPO_PASSWORD.
 * With both a username and a password, every repository below is added, with those
 * credentials. Without both, nothing is added. Either way a line is logged, once for each
 * build (the root build, buildSrc and included builds), and it never has the credentials.
 *
 * Where they are added, once the settings have been evaluated, so after the repositories
 * that settings.gradle declares:
 *  - the plugin repositories of the settings (pluginManagement), with the Gradle Plugin
 *    Portal first if the build declares none, as it is the default only while there are none;
 *  - the repositories of the settings (dependencyResolutionManagement);
 *  - the repositories of each project, once it has been evaluated, after the afterEvaluate
 *    callbacks of the build and of its plugins have run (so after the repositories that a
 *    plugin adds in an afterEvaluate of its own), only if the repositories mode of the
 *    settings is PREFER_PROJECT and the project has repositories by then, its own or a
 *    plugin's. A project that uses the repositories of the settings is left on them, and
 *    none is added to a project when the settings prefer their own or reject the ones of a
 *    project.
 *
 * Not covered: the buildscript repositories of a project, which are used as soon as the
 * buildscript block ends, and the plugins block of settings.gradle, which is resolved while
 * settings.gradle is evaluated. usw1-mirrors.gradle redirects the plugin portal and Maven
 * Central there. A configuration that is resolved while a project is configured, before it
 * has been evaluated, does not see these repositories.
 */
def logPrefix = "commercial-repositories:"

def addCommercialRepositories = { repositories, repoUsername, repoPassword, snapshot ->
	repositories.maven {
		name = "spring-commercial-release"
		url = uri("https://repo.spring.io/artifactory/spring-commercial-release-remote")
		credentials {
			username = repoUsername
			password = repoPassword
		}
	}
	repositories.maven {
		name = "spring-enterprise-release"
		url = uri("https://usw1.packages.broadcom.com/spring-enterprise-maven-prod-local")
		credentials {
			username = repoUsername
			password = repoPassword
		}
	}
	if (snapshot) {
		repositories.maven {
			name = "spring-commercial-snapshot"
			url = uri("https://usw1.packages.broadcom.com/spring-enterprise-maven-dev-local")
			credentials {
				username = repoUsername
				password = repoPassword
			}
		}
	}
}

gradle.settingsEvaluated { settings ->
	// Gradle properties are only available once there are settings
	def repoUsername = settings.providers.gradleProperty("artifactoryUsername").orNull ?: System.getenv("COMMERCIAL_REPO_USERNAME")
	def repoPassword = settings.providers.gradleProperty("artifactoryPassword").orNull ?: System.getenv("COMMERCIAL_REPO_PASSWORD")

	if (!repoUsername || !repoPassword) {
		logger.lifecycle("${logPrefix} Artifactory credentials are not set, " +
				"not adding the Spring commercial repositories")
		return
	}

	logger.lifecycle("${logPrefix} Artifactory credentials are set, " +
			"adding the Spring commercial repositories after the repositories of the build")

	def pluginRepositories = settings.pluginManagement.repositories
	if (pluginRepositories.isEmpty()) {
		pluginRepositories.gradlePluginPortal()
	}
	addCommercialRepositories(pluginRepositories, repoUsername, repoPassword, false)

	def settingsVersion = settings.providers.gradleProperty("version").orNull
	def settingsSnapshot = settingsVersion != null && settingsVersion.endsWith("-SNAPSHOT")
	def dependencyResolution = settings.dependencyResolutionManagement
	addCommercialRepositories(dependencyResolution.repositories, repoUsername, repoPassword, settingsSnapshot)

	if (dependencyResolution.repositoriesMode.get().name() == "PREFER_PROJECT") {
		settings.gradle.allprojects { project ->
			project.afterEvaluate {
				// The callbacks run in the order they were added, and this one was added before
				// the ones of the build and its plugins. Adding another one here puts it after
				// them, so a plugin that adds its repositories in an afterEvaluate of its own,
				// such as SpringRepositoryPlugin, has added them by the time this one runs.
				project.afterEvaluate {
					if (!project.repositories.isEmpty()) {
						addCommercialRepositories(project.repositories, repoUsername, repoPassword,
								"${project.version}".endsWith("-SNAPSHOT"))
					}
				}
			}
		}
	}
}
